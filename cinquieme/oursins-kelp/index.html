<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Les oursins envahissent le kelp – revise svt</title>
<meta name="description" content="Activité de SVT en cinquième : une tâche complexe en forme d’enquête sur la forêt de kelp en Alaska, la surpêche et la biodiversité.">
<link rel="icon" href="../../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Mise en page : carnet d’enquête sous-marin. Bandeau « grand fond » en tête, puis écrans de mission en deux colonnes (document | questions). */
:root{
  --bg:#EEF3F0; --surface:#FBFDFC; --sunk:#E3ECE8; --ink:#13303A; --muted:#55706F; --line:#C8D7D2; --grid:#DCE6E2;
  --accent:#0C6767; --accent-ink:#FFFFFF; --accent-soft:#D5ECE8;
  --deep:#0F2D36; --deep-ink:#E7F3EF; --deep-muted:#9CC0BC; --deep-tick:#6FD3C4; --on-deep-urchin:#F29AD6;
  --kelp:#8E7421; --kelp2:#5C7A26; --otter:#4C8E2C; --urchin:#A2307E; --obs:#2D5DA6;
  --ok:#2B7A46; --ok-soft:#DCF0E2; --bad:#B03838; --bad-soft:#F8E1DE; --info:#8A6A12;
  --note:#F6E7B4; --note-ink:#463808;
  --tile:#D5EBF1; --arrow:#D45F2A; --arrow-rare:#2C4D9C;
  --fish:#AFC4CF; --fish-back:#3C6A86; --seal:#8D979B; --seal-d:#6A767A; --orca:#192125; --orca-w:#F2F6F5; --orca-g:#7C878B;
  --fur:#8A5C3A; --fur-l:#DDBC95; --fur-d:#6B4429; --urch:#3B1E3A; --urch-sp:#2A1428; --urch-hl:#6A3A66;
  --boat:#C4502B; --cabin:#F3E5CA; --water:#5EA6C4; --ill-ink:#151A1C;
  --sky:#CFE4EA; --mount:#8FA9B3; --mount2:#A9BFC7; --snow:#FFFFFF; --sea:#3D7F9B;
  --sea-top:#3F8796; --sea-bot:#0D2B34; --ray:#BFE7E6; --hk-near:#B08F2F; --hk-near2:#7F9233; --hk-far:#2E5F60; --hsand:#8C7E55;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A1E; --surface:#12252B; --sunk:#0F2127; --ink:#E2EEEA; --muted:#9BB4B1; --line:#284249; --grid:#1C3339;
    --accent:#53C2B6; --accent-ink:#06211F; --accent-soft:#163A3A;
    --deep:#081519; --deep-ink:#E2EEEA; --deep-muted:#88A9A5; --deep-tick:#6FD3C4; --on-deep-urchin:#F29AD6;
    --kelp:#D1B04F; --kelp2:#9DBB5A; --otter:#8BCB62; --urchin:#E37BC8; --obs:#86A8F0;
    --ok:#6FCB8F; --ok-soft:#153422; --bad:#F08C86; --bad-soft:#3A1C1B; --info:#E2C163;
    --note:#3B3418; --note-ink:#F2E3A8;
    --tile:#24525C; --arrow:#F08A55; --arrow-rare:#93ACF2;
    --fish-back:#5D8FAD; --orca:#0F1518; --urch:#5C2C59; --urch-sp:#4B2148; --urch-hl:#8A4E85; --cabin:#E8D9BD; --water:#2F6E88;
    --sky:#1A3B45; --mount:#2B4D57; --mount2:#34575F; --snow:#DCE8EA; --sea:#1C4B5C;
    --sea-top:#21545F; --sea-bot:#061519; --ray:#7FC2C0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1A1E; --surface:#12252B; --sunk:#0F2127; --ink:#E2EEEA; --muted:#9BB4B1; --line:#284249; --grid:#1C3339;
  --accent:#53C2B6; --accent-ink:#06211F; --accent-soft:#163A3A;
  --deep:#081519; --deep-ink:#E2EEEA; --deep-muted:#88A9A5; --deep-tick:#6FD3C4; --on-deep-urchin:#F29AD6;
  --kelp:#D1B04F; --kelp2:#9DBB5A; --otter:#8BCB62; --urchin:#E37BC8; --obs:#86A8F0;
  --ok:#6FCB8F; --ok-soft:#153422; --bad:#F08C86; --bad-soft:#3A1C1B; --info:#E2C163;
  --note:#3B3418; --note-ink:#F2E3A8;
  --tile:#24525C; --arrow:#F08A55; --arrow-rare:#93ACF2;
  --fish-back:#5D8FAD; --orca:#0F1518; --urch:#5C2C59; --urch-sp:#4B2148; --urch-hl:#8A4E85; --cabin:#E8D9BD; --water:#2F6E88;
  --sky:#1A3B45; --mount:#2B4D57; --mount2:#34575F; --snow:#DCE8EA; --sea:#1C4B5C;
  --sea-top:#21545F; --sea-bot:#061519; --ray:#7FC2C0;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-padding-top:130px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--deep)}
a{color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête et étapes */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--deep);color:var(--deep-ink)}
.top-in{max-width:1180px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.12rem;color:inherit;text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--on-deep-urchin)}
.steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 420px;min-width:0;padding-block:2px}
.steps::-webkit-scrollbar{display:none}
.step{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;color:var(--deep-muted);text-decoration:none;font-size:.88rem;font-weight:700;white-space:nowrap}
.step:hover{color:var(--deep-ink)}
.step:focus-visible{outline:2px solid var(--deep-tick);outline-offset:2px}
.step .n{font-family:var(--f-mono);font-size:.72rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor}
.step .tick{display:none;color:var(--deep-tick)}
.step.done .tick{display:inline}
.step[aria-current="page"]{background:var(--deep-ink);color:var(--deep)}
.step[aria-current="page"] .tick{color:inherit}

/* Écrans */
.wrap{max-width:1180px;margin:0 auto;padding-block:30px 60px}
.eyebrow{font-family:var(--f-mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:0 0 6px;font-weight:600}
.mhead{margin-bottom:24px;max-width:72ch}
.mhead h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,3.6vw,2.4rem);line-height:1.06;letter-spacing:-.015em;margin:0;text-wrap:balance}
.lead{margin:10px 0 0;font-size:1.05rem;color:var(--muted)}
.h3{font-family:var(--f-display);font-weight:700;font-size:1.18rem;margin:0 0 12px}
.label{font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;margin:0;font-weight:600;opacity:.85}

/* Accueil */
.hero{background:var(--deep);color:var(--deep-ink)}
.hero-in{max-width:1180px;margin:0 auto;padding-block:34px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:28px;align-items:end}
.hero-text{padding-bottom:40px}
.hero .eyebrow{color:var(--deep-tick)}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,5.4vw,3.9rem);line-height:.98;letter-spacing:-.025em;margin:6px 0 16px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--on-deep-urchin)}
.hero-lead{font-size:1.12rem;margin:0;max-width:44ch;color:var(--deep-ink)}
.coords{font-family:var(--f-mono);font-size:.8rem;color:var(--deep-muted);margin:16px 0 0;letter-spacing:.04em}
.scene{display:block;width:100%;height:clamp(220px,30vw,330px);border-radius:22px 22px 0 0}
.rays path{fill:var(--ray);opacity:.09}
.st-top{stop-color:var(--sea-top)} .st-bot{stop-color:var(--sea-bot)}
.hsand{fill:var(--hsand)}
.kelp-far .ks{fill:none;stroke:var(--hk-far);stroke-width:3.2;stroke-linecap:round}
.kelp-far .kb,.kelp-far .kf{fill:var(--hk-far)}
.kelp-near .ks{fill:none;stroke:var(--hk-near);stroke-width:4;stroke-linecap:round}
.kelp-near .kb{fill:var(--hk-near)} .kelp-near .kb path:nth-child(even){fill:var(--hk-near2)} .kelp-near .kf{fill:var(--hk-near2)}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.4deg)}to{transform:rotate(2.4deg)}}
.school{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}

.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fact{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.fact p{margin:0;font-size:.98rem}
.tile-i{width:64px;height:64px;border-radius:14px;background:var(--tile);display:grid;place-items:center;position:relative;flex:none}
.tile-i svg{width:56px;height:56px}
.brief{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-top:14px}
.problem{padding:22px 24px;border-radius:18px;background:var(--deep);color:var(--deep-ink)}
.problem .label{color:var(--deep-tick)}
.big-q{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,3vw,2.15rem);line-height:1.08;margin:8px 0 0;text-wrap:balance}
.consigne{padding:22px 24px;border-radius:18px;border:2px solid var(--ink)}
.consigne p:last-child{margin:8px 0 0;font-size:1.06rem}
.h-sec{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:42px 0 4px;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted)}
.route{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:12px}
.route li{flex:1 1 190px;display:flex}
.route a{flex:1;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.route a:hover{border-color:var(--accent);transform:translateY(-2px)}
.route a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rn{font-family:var(--f-mono);font-size:.74rem;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.rt{font-family:var(--f-display);font-weight:700;font-size:1.08rem;line-height:1.2}
.rd{font-size:.9rem;color:var(--muted)}
.start{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;margin-top:28px}
.skill{margin:0;font-size:.92rem;color:var(--muted);max-width:48ch}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:.98rem;padding:11px 18px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{font-size:1.1rem;padding:14px 24px}
.btn.small{font-size:.88rem;padding:7px 12px;border-radius:10px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Mission : document + questions */
.mission{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:28px;align-items:start}
.pane{display:flex;flex-direction:column;gap:16px;min-width:0}
.doc{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.doc-cap{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.25}
.doc-n{font-family:var(--f-mono);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);padding:3px 8px;border-radius:6px}
.doc-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.fiche{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;align-items:center;padding:12px;border-radius:14px;background:var(--sunk)}
.fiche-ill{width:92px;height:82px;border-radius:12px;background:var(--tile);display:grid;place-items:center}
.fiche-ill svg{width:80px;height:80px}
.fiche-dl{margin:0;display:grid;gap:5px}
.fiche-dl div{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:baseline}
.fiche-dl dt{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:8.2rem}
.fiche-dl dd{margin:0;font-weight:700}

.graph{width:100%;height:auto;display:block;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.g-title{font-family:var(--f-body);font-weight:700;font-size:12.5px;fill:var(--ink)}
.g-grid{stroke:var(--grid);stroke-width:1}
.g-minor{stroke:var(--grid);stroke-width:1;stroke-dasharray:2 4}
.g-axis{stroke:var(--ink);stroke-width:1.4}
.g-arrh{fill:var(--ink)}
.g-tick{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.g-lab{font-family:var(--f-body);font-size:12px;font-weight:700;fill:var(--ink)}
.g-otter{fill:none;stroke:var(--otter);stroke-width:3.2;stroke-linecap:round}
.g-urch{fill:none;stroke:var(--urchin);stroke-width:3.2;stroke-linecap:round}
.g-name{font-family:var(--f-display);font-weight:700;font-size:13.5px}
.g-name-u{fill:var(--urchin)} .g-name-o{fill:var(--otter)}
.g-ruler{stroke:var(--accent);stroke-width:2}
.g-guide{stroke:var(--accent);stroke-width:1.4;stroke-dasharray:5 4}
.g-dot{stroke:var(--surface);stroke-width:2}
.g-dot-o{fill:var(--otter)} .g-dot-u{fill:var(--urchin)}
.ruler-ctl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;font-weight:700;font-size:.92rem}
.ruler-ctl input{accent-color:var(--accent);width:100%}
.ruler-ctl output{font-family:var(--f-mono);font-size:.88rem;min-width:4.6em;text-align:right}
.ruler-tip{margin:-6px 0 0;font-size:.85rem;color:var(--muted)}

.net-wrap{overflow-x:auto}
.net{width:100%;min-width:480px;height:auto;display:block}
.tile{fill:var(--tile)}
.nlabel{font-family:var(--f-display);font-weight:700;font-size:14px;fill:var(--ink);text-anchor:middle}
.edge{fill:none;stroke:var(--arrow);stroke-width:3;stroke-linecap:round}
.edge.rare{stroke:var(--arrow-rare);stroke-dasharray:7 6}
.ah{fill:var(--arrow)} .ah-rare{fill:var(--arrow-rare)}
.net.interactive .node{cursor:pointer}
.net.interactive .node:hover .tile,.node:focus-visible .tile{stroke:var(--accent);stroke-width:3}
.node:focus{outline:none}
.node.picked .tile{stroke:var(--accent);stroke-width:4;fill:var(--accent-soft)}
.node.picked .nlabel{fill:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.88rem;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:8px}
.lg svg{width:44px;height:12px;overflow:visible}
.lg .edge{stroke-width:2}
.pick-status{margin:0;font-size:.9rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:7px 12px;border-radius:10px;align-self:flex-start}
.pick-status:empty{display:none}

.scene1{width:100%;height:auto;display:block;border-radius:12px}
.sky{fill:var(--sky)} .mount{fill:var(--mount)} .mount2{fill:var(--mount2)} .snow{fill:var(--snow)} .sea{fill:var(--sea)}
.wave{fill:none;stroke:var(--water);stroke-width:2}
.bag{fill:var(--fish-back);opacity:.35}
.bag-edge{fill:none;stroke:var(--ill-ink);stroke-width:1.5;opacity:.6}
.mesh{stroke:var(--ill-ink);stroke-width:.8;opacity:.3}
.scene-cap{margin:6px 0 0;font-size:.88rem;font-weight:700;color:var(--muted)}

/* Illustrations */
.k-stalk{fill:none;stroke:var(--kelp);stroke-width:4;stroke-linecap:round}
.k-stalk.thin{stroke-width:2.6}
.k-blade{fill:var(--kelp)} .k-blade2,.k-float{fill:var(--kelp2)}
.f-body{fill:var(--fish)} .f-back,.f-tail,.f-fin{fill:var(--fish-back)}
.f-gill{fill:none;stroke:var(--fish-back);stroke-width:1.6}
.eye,.nose{fill:var(--ill-ink)}
.whisk{fill:none;stroke:var(--ill-ink);stroke-width:1;opacity:.55}
.seal-b{fill:var(--seal)} .seal-d{fill:var(--seal-d)}
.orca-b{fill:var(--orca)} .orca-w{fill:var(--orca-w)} .orca-g{fill:var(--orca-g)}
.fur{fill:var(--fur)} .fur-l{fill:var(--fur-l)} .fur-d{fill:var(--fur-d)}
.u-body{fill:var(--urch)} .u-hl{fill:var(--urch-hl);opacity:.6}
.u-sp{stroke:var(--urch-sp);stroke-linecap:round}
.hull{fill:var(--boat)} .cabin{fill:var(--cabin)} .win{fill:var(--fish-back)}
.mast{fill:none;stroke:var(--ill-ink);stroke-width:2.4}
.netline{fill:none;stroke:var(--ill-ink);stroke-width:1.2;opacity:.6}
.water{fill:var(--water)} .netbag{fill:var(--fish-back);opacity:.7}

/* Questions */
.qform{display:flex;flex-direction:column}
.q{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding-block:16px;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:2px}
.qn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600;background:var(--sunk);color:var(--muted)}
.q.is-ok .qn{background:var(--ok);color:var(--surface)}
.q.is-bad .qn{background:var(--bad);color:var(--surface)}
.ql{display:block;font-weight:700;margin:2px 0 10px;line-height:1.4}
.numrow{display:flex;align-items:center;gap:8px}
.num{width:6.5rem;font:inherit;font-family:var(--f-mono);font-size:1rem;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.num:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.unit{font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex;align-items:center;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface);font-size:.97rem;line-height:1.3}
.opt:hover{border-color:var(--muted)}
.opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.pickrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.picked{font-size:.95rem;color:var(--muted)}
.picked b{color:var(--ink)}
.q.pick.active{background:var(--accent-soft);border-radius:14px;padding-inline:10px;margin-inline:-10px;border-top-color:transparent}
.q.pick.active + .q{border-top-color:transparent}
.fb{margin:8px 0 0;font-size:.93rem;line-height:1.45}
.fb:empty{display:none}
.fb.ok{color:var(--ok)} .fb.ok::before{content:"✓ ";font-weight:700}
.fb.bad{color:var(--bad)} .fb.bad::before{content:"✗ ";font-weight:700}
.fb.info{color:var(--info)}
.ta{width:100%;font:inherit;font-size:1rem;line-height:1.55;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);resize:vertical}
.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cmp{margin-top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.model{margin:0;padding:10px 14px;border-radius:10px;background:var(--sunk);font-style:italic}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
.sum{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}

details.hint{margin:0 0 14px;background:var(--note);color:var(--note-ink);border-radius:6px 16px 16px 16px;padding:12px 16px}
details.hint summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.hint summary::-webkit-details-marker{display:none}
details.hint summary::before{content:"+";font-family:var(--f-mono);font-weight:600;width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:.8rem;line-height:1}
details.hint[open] summary::before{content:"–"}
details.hint ul{margin:10px 0 2px;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px;font-size:.95rem}

.clue{margin-top:20px;padding:18px 20px;border:2px dashed var(--accent);border-radius:16px;background:var(--accent-soft);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.clue:empty{display:none}
.clue-tag{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;font-size:.76rem;color:var(--accent);margin:0;font-weight:600}
.clue-t{margin:0;font-size:1.02rem}

details.more,details.dossier{margin-top:4px}
details.more summary,details.dossier summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;display:inline-flex;align-items:center;gap:8px;padding:8px 0}
details.more summary::-webkit-details-marker,details.dossier summary::-webkit-details-marker{display:none}
details.more summary::after,details.dossier summary::after{content:"↓";font-family:var(--f-mono)}
details.more[open] summary::after,details.dossier[open] summary::after{content:"↑"}
details.dossier{margin-top:34px;border-top:1px solid var(--line);padding-top:12px}
.dossier-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-top:10px;align-items:start}

/* Fil des causes */
.chain-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:start}
.pool{display:flex;flex-direction:column;gap:10px}
.card{display:block;width:100%;text-align:left;font:inherit;font-size:.98rem;line-height:1.4;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line);transition:transform .12s,border-color .12s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{margin:0;padding:14px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-size:.95rem}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:32px}
.link{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 10px 10px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--ink)}
.link+.link::before{content:"↓ donc";position:absolute;left:16px;top:-27px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);letter-spacing:.03em}
.link.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.link.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.pos{font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--muted);text-align:center}
.lt{font-size:.98rem;line-height:1.4}
.src{display:inline-block;margin-left:6px;font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:5px;background:var(--ok);color:var(--surface);vertical-align:middle}
.ctl{display:flex;gap:4px}
.ib{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer;display:grid;place-items:center}
.ib:hover{border-color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.ib:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.empty-chain{padding:16px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-size:.95rem}

/* Rédaction */
.write{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:28px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chips .label{color:var(--muted);margin-right:2px}
.chip{font:inherit;font-size:.88rem;padding:6px 10px;border-radius:8px;border:1px dashed var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.chip:hover{background:var(--accent-soft)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ta.big{min-height:24rem;line-height:1.75rem;padding:.9rem 16px;background-color:var(--surface);background-image:linear-gradient(to bottom,transparent calc(1.75rem - 1px),var(--grid) 1.75rem);background-size:100% 1.75rem;background-position:0 .9rem;background-attachment:local}
.write-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}
.wc{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.write-bar .fb{margin:0}
.unlock{margin-top:22px;padding:18px 20px;border-radius:16px;background:var(--sunk);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.unlock p{margin:0}
.teacher summary{cursor:pointer;font-size:.86rem;color:var(--muted)}
.tform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:.9rem}
.tform input{font:inherit;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:9rem}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side section{padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.side h3{font-family:var(--f-display);font-size:1.08rem;margin:0 0 10px}
.method ol{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:9px;font-size:.94rem}
.method b{display:block}
.clues ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:.93rem}
.cl{padding:10px 12px;border-radius:10px;border:1.5px dashed var(--line);color:var(--muted)}
.cl.got{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.cl-n{display:block;font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600;margin-bottom:2px}
.crit label{display:flex;gap:10px;align-items:flex-start;font-size:.93rem;padding:6px 0;cursor:pointer}
.crit input{accent-color:var(--accent);width:18px;height:18px;margin-top:2px;flex:none}

/* Correction */
.corr-wrap{display:flex;flex-direction:column;gap:30px;max-width:960px}
.locked{padding:22px 24px;border-radius:18px;background:var(--sunk);display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:640px}
.locked p{margin:0}
details.mine summary{cursor:pointer;font-weight:700;color:var(--accent)}
.mine-text{padding:14px 16px;border-radius:12px;background:var(--sunk);margin-top:10px}
.ckey{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.ck{display:inline-block;font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:6px;color:var(--bg);font-weight:600;line-height:1.3}
.k-intro{background:var(--accent)} .k-obs{background:var(--obs)} .k-ded{background:var(--otter)} .k-con{background:var(--kelp)} .k-concl{background:var(--urchin)}
.k-link{background:var(--accent-soft);color:var(--ink)} .k-data{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.corr{display:flex;flex-direction:column;gap:18px}
.cp{display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:16px;align-items:start}
.cp .ck{justify-self:start;margin-top:5px}
.cp p{margin:0;font-size:1.05rem;line-height:1.68;max-width:68ch}
.cp b{font-weight:700;background:linear-gradient(transparent 56%,var(--accent-soft) 56%)}
.data{font-family:var(--f-mono);font-size:.9em;padding:1px 6px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.prob{font-weight:700;color:var(--urchin)}
.schema{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 4px}
.sch{display:flex;flex-direction:column;align-items:center;gap:8px;width:100px;text-align:center;font-size:.85rem;font-weight:700;line-height:1.25}
.sep{color:var(--muted);font-size:1.3rem;margin-top:18px}
.trend{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--ink);color:var(--bg)}
.trend.up{background:var(--urchin)}
.bilan{background:var(--deep);color:var(--deep-ink);border-radius:20px;padding:24px 28px}
.bilan .label{color:var(--deep-tick)}
.bilan h3{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin:6px 0 10px;text-wrap:balance;line-height:1.15}
.bilan p{margin:0;font-size:1.08rem;line-height:1.62;max-width:66ch}
.reset-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.foot{border-top:1px solid var(--line)}
.foot-in{max-width:1180px;margin:0 auto;padding-block:18px 28px;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 22px}

@media (max-width:900px){
  .mission,.chain-grid,.write{grid-template-columns:minmax(0,1fr)}
  .hero-in{grid-template-columns:minmax(0,1fr);gap:0}
  .hero-text{padding-bottom:24px}
  .scene{height:210px}
}
@media (max-width:760px){
  .facts,.brief{grid-template-columns:minmax(0,1fr)}
  .cp{grid-template-columns:minmax(0,1fr);gap:6px}
  .sch{width:84px}
}
@media (max-width:480px){
  body{font-size:16px}
  .fiche{grid-template-columns:72px minmax(0,1fr)}
  .fiche-ill{width:72px;height:68px}
  .fiche-ill svg{width:64px;height:64px}
  .fiche-dl dt{min-width:0;width:100%}
  .link{grid-template-columns:22px minmax(0,1fr)}
  .ctl{grid-column:2;justify-content:flex-start}
  .ruler-ctl{grid-template-columns:minmax(0,1fr) auto}
  .ruler-ctl label{grid-column:1 / -1}
}
@media (prefers-reduced-motion: reduce){
  .sway,.school{animation:none}
  .route a,.card{transition:none}
}

.gate-scene{position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 35%);mask-image:linear-gradient(to bottom,transparent,#000 35%)}
.gate-scene .scene{height:100%;border-radius:0}

.gform label{font-weight:700}
.grow{display:flex;gap:8px}
.grow input{flex:1;min-width:0;font:inherit;font-family:var(--f-mono);font-size:1.1rem;letter-spacing:.12em;text-transform:uppercase;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.grow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gate-back{font-size:.92rem;font-weight:700;color:var(--accent);text-decoration:none;margin-top:4px}

    .then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(P.i)},k,bytes(P.c));})

      var d=JSON.parse(new TextDecoder().decode(buf));
      var site=$("#site"); site.innerHTML=d.html;
      $("#gate").hidden=true; site.hidden=false;
      var sc=document.createElement("script"); sc.textContent=d.js; document.body.appendChild(sc);
      try{localStorage.setItem(KEY,norm(code));}catch(e){}
    });
}
function busy(on){btn.disabled=on; btn.textContent=on?"Ouverture…":"Ouvrir";}
var saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
if(!ok){say("bad","Ton navigateur ne peut pas ouvrir cette activité. Vérifie que l’adresse commence par https:// ou essaie un autre navigateur.");}
else if(saved){busy(true); open(saved).catch(function(){try{localStorage.removeItem(KEY);}catch(e){} busy(false);});}
else if(window.matchMedia&&window.matchMedia("(pointer: fine)").matches){try{input.focus();}catch(e){}}
$("#gform").addEventListener("submit",function(e){
  e.preventDefault(); if(!ok||btn.disabled) return;
  if(!input.value.trim()){say("info","Écris d’abord le code."); return;}
  busy(true); fb.textContent="";
  open(input.value).catch(function(){busy(false); say("bad","Ce n’est pas le bon code. Vérifie-le auprès de ton professeur."); input.select();});
});
})();
</script>
